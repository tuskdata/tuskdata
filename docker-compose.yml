# TuskData — minimal community Compose file.
#
# Default `up` runs the Studio bundled with the public tusk-cluster
# plugin. Set WITH_CLUSTER=0 in .env to drop it. Profiles let you bring
# up extras for testing:
#
#   --profile cluster   adds scheduler + worker for distributed queries
#   --profile pg        adds a Postgres sidecar (testing only)
#   --profile dbtools   adds Adminer at :8080
#
# For the full TuskData suite (BI, CI, security plugins), use the
# tuskdata/tuskdata-compose deployment harness instead — it composes
# this image with the closed plugin set.
#
#   cp .env.example .env
#   docker compose up --build

x-tusk-env: &tusk-env
  TUSK_DEBUG: "${TUSK_DEBUG:-0}"
  TUSK_LOG_LEVEL: "${TUSK_LOG_LEVEL:-info}"
  TUSK_LOG_FORMAT: "${TUSK_LOG_FORMAT:-console}"
  TUSK_QUERY_TIMEOUT: "${TUSK_QUERY_TIMEOUT:-300}"
  TUSK_CLUSTER_SECRET: "${TUSK_CLUSTER_SECRET:-}"
  TUSK_CLUSTER_TLS: "${TUSK_CLUSTER_TLS:-0}"
  TUSK_PORT: "${TUSK_PORT:-8000}"
  TZ: "${TZ:-UTC}"

services:
  tusk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TUSK_CLUSTER_REF: "${TUSK_CLUSTER_REF:-v0.2.1}"
        WITH_CLUSTER: "${WITH_CLUSTER:-1}"
    image: tuskdata:local
    environment:
      <<: *tusk-env
    ports:
      - "${TUSK_HOST_PORT:-7000}:8000"
    volumes:
      - tusk-home:/var/lib/tusk
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  scheduler:
    profiles: ["cluster", "all"]
    image: tuskdata:local
    depends_on:
      tusk:
        condition: service_started
    environment:
      <<: *tusk-env
    command: ["sh", "-c", "exec tusk scheduler --host 0.0.0.0 --port 8814"]
    expose:
      - "8814"
    volumes:
      - tusk-home:/var/lib/tusk
    restart: unless-stopped

  worker:
    profiles: ["cluster", "all"]
    image: tuskdata:local
    depends_on:
      scheduler:
        condition: service_started
    environment:
      <<: *tusk-env
    command: ["sh", "-c", "exec tusk worker --scheduler scheduler:8814 --host 0.0.0.0 --port 8815"]
    expose:
      - "8815"
    volumes:
      - tusk-home:/var/lib/tusk
    deploy:
      replicas: 1
    restart: unless-stopped

  postgres:
    profiles: ["pg", "all"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tusk}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tusk}"
      POSTGRES_DB: "${POSTGRES_DB:-tusk}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tusk} -d ${POSTGRES_DB:-tusk}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  adminer:
    profiles: ["dbtools", "all"]
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "${ADMINER_DEFAULT_SERVER:-postgres}"
    restart: unless-stopped

volumes:
  postgres-data:
  tusk-home:
