[project]
name = "tuskdata"
version = "0.4.20"
description = "Modern data platform - PostgreSQL admin + Analytics engine"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Jearel Alcantara" }
]
keywords = ["postgresql", "admin", "analytics", "duckdb", "polars", "etl", "sql", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
]
# Python 3.13 matches the production Docker base image
# (`python:3.13-slim`). Bumped from 3.12 in v0.4.17 to align prod/dev/CI.
# 3.14 is tested in parallel via the CI matrix; will become the default
# once it has 1-2 quiet releases under it.
requires-python = ">=3.13"
# Core dependencies - minimal, always required
dependencies = [
    # msgspec 0.21+ ships ~40% faster JSON encoding, which is in the
    # hot path for every API response we render. 0.20 is the floor for
    # the new tuple-hash fix on Python 3.14.
    "msgspec>=0.21",
    "structlog>=24.0",     # Structured logging
    "tomli-w>=1.0",        # Config file writing
    "httpx>=0.27",         # HTTP client (for future ETL workflows)
    "argon2-cffi>=23.1",   # Secure password hashing (argon2id)
    "cryptography>=42.0",  # Fernet symmetric encryption for connection secrets
]

[project.optional-dependencies]
# PostgreSQL connectivity
postgres = [
    "psycopg[binary]>=3.0",
    "psycopg_pool>=3.0",
    "asyncssh>=2.20",          # SSH tunneling for connections behind a bastion
]

# Web UI + Data engines (Studio, Data page)
studio = [
    "tuskdata[postgres]",
    "litestar>=2.0",         # Web framework
    "granian>=2.0",          # ASGI server
    "minijinja>=2.0",        # Rust-based templates (MiniJinja)
    # DuckDB 1.5 ships Python 3.14 wheels + Polars LazyFrame pushdown
    # improvements. We're already past the 1.0 baseline; the floor
    # bumps because tusk-cluster also needs >=1.5 once we touch it.
    "duckdb>=1.5",           # Analytics engine
    "polars>=1.0",           # DataFrame transforms
    "pyarrow>=17.0",         # Arrow format support
    "apscheduler>=3.10,<4",  # Task scheduler — 4.x reorganized imports (no apscheduler.schedulers)
    "ibis-framework[duckdb,polars]>=10.0",  # Unified DataFrame API (ETL engine)
]

# Admin features (scheduled tasks, monitoring)
admin = [
    "apscheduler>=3.11.2,<4",  # Task scheduler — pin under 4.x
    "psutil>=5.9",           # System metrics
]

# Cluster mode plugin (distributed queries with DataFusion)
cluster = [
    "tusk-cluster>=0.1.0",   # Cluster plugin (brings datafusion, pyarrow)
]

# OpenTelemetry tracing (opt-in). Pulled in only when admins want to
# ship spans to a collector — TUSK_OTEL_ENDPOINT must also be set for
# the SDK to actually wire up.
otel = [
    "opentelemetry-api>=1.21",
    "opentelemetry-sdk>=1.21",
    "opentelemetry-exporter-otlp-proto-http>=1.21",
    # opentelemetry-instrumentation-litestar deliberately NOT pinned.
    # As of May 2026 only the 0.1.0 stub is on PyPI — it doesn't even
    # publish the `opentelemetry.instrumentation.litestar` module, so
    # depending on it adds nothing. `core/otel.py` already handles the
    # ImportError gracefully (logs "instrumentation not installed"
    # and proceeds without HTTP-span coverage). When the real package
    # ships, users can `pip install opentelemetry-instrumentation-litestar`
    # on top, or we re-add the pin here.
]

# Everything
all = [
    "tuskdata[studio,admin,cluster]",
]

[project.urls]
Homepage = "https://github.com/tuskdata/tuskdata"
Repository = "https://github.com/tuskdata/tuskdata"
Issues = "https://github.com/tuskdata/tuskdata/issues"

[project.scripts]
tusk = "tusk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tusk"]

[tool.hatch.targets.wheel.sources]
"src" = ""

# Include non-Python files (templates, static assets)
[tool.hatch.build]
include = [
    "src/tusk/**/*.py",
    "src/tusk/studio/templates/**/*.html",
    "src/tusk/studio/static/**/*.js",
    "src/tusk/studio/static/**/*.css",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [
    ".venv",
    "build",
    "dist",
    "tests/fixtures",
]

[tool.ruff.lint]
# Start with a minimal rule set focused on **correctness**, not style.
# We can layer in more rules once the codebase is clean against this
# baseline. Each block has a comment explaining why it's on.
select = [
    # ASYNC: blocking I/O inside `async def` bodies. The backup hang
    # (specs/bugs/2026-04-30-backups-hang-and-lie.md) was caused
    # exactly by this — synchronous `subprocess.Popen.communicate`
    # inside an async route handler froze the worker. Letting ruff
    # catch the pattern statically beats post-incident debugging.
    "ASYNC",
    # Pyflakes: undefined names, unused imports — cheap, high signal.
    "F",
    # Pycodestyle errors (E) but not whitespace warnings (W) — we don't
    # want our diffs polluted with whitespace churn yet.
    "E",
]
# Suppress rules that would create churn without proportional value.
ignore = [
    "E501",   # line too long — line-length already set; let some long
              # strings/URLs slide rather than wrapping them awkwardly.
    "E731",   # lambda assignment — used in a few places intentionally.
    "ASYNC110",  # while True + asyncio.sleep — used in legit poller loops.
    "ASYNC240",  # pathlib.Path methods in async functions. The rule
                 # assumes trio's stricter purity model — for asyncio
                 # apps with reasonable filesystem latency the cost is
                 # negligible. Migrating to anyio.Path is on the radar
                 # but not P1.
]

[tool.ruff.lint.per-file-ignores]
# Test files often import for side effects, define fixtures with
# unusual shapes, or hardcode dev-only patterns. Loosen rules there.
"tests/**" = ["F401", "F811"]
