site_name: Tusk Studio
site_description: A single-binary data platform for PostgreSQL teams.
site_url: https://tuskdata.github.io/tuskdata/
repo_url: https://github.com/tuskdata/tuskdata
repo_name: tuskdata/tuskdata
docs_dir: docs
strict: false  # flip to true once the docs are warning-clean

theme:
  name: material
  palette:
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Features:
      - Home tab: features/home.md
      - Studio: features/studio.md
      - Schema: features/schema.md
      - Explore: features/explore.md
      - Admin: features/admin.md
      - Scheduled: features/scheduled.md
      - Data: features/data.md
      - Notifications: features/notifications.md
      - Analytics: features/analytics.md
      - Schema Watch: features/schema-watch.md
      - Data Contracts: features/data-contracts.md
      - MCP server: features/mcp.md
      - Users & API tokens: features/auth.md
  - Desktop window (preview): features/desktop.md
  - Deployment:
      - Kubernetes: deployment/kubernetes.md
