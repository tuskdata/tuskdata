name: Publish to PyPI

# Fires on annotated/lightweight tags matching v* (e.g. v0.4.12).
# Manual dispatch is enabled for emergency re-runs of an existing tag.
# Besides PyPI, the `image` job builds the in-repo Dockerfile and pushes
# ghcr.io/tuskdata/tuskdata:<version> (+ :latest) — the image the
# Kubernetes docs reference.
#
# Uses PyPI trusted publishing (OIDC) — no API token in repo secrets.
# The matching trusted publisher config on PyPI is:
#   - Repository: tuskdata/tuskdata
#   - Workflow:   publish.yml
#   - Environment: pypi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # We don't ship a uv.lock — it's a library, not an app.
          # Without this, setup-uv looks for **/uv.lock by default and
          # fails the job when none exists. Point the cache key at
          # pyproject.toml so the cache still invalidates on dep changes.
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python
        # Match the production Docker base (python:3.13-slim).
        # Library wheels are pure Python, so the build version doesn't
        # constrain consumers, but keeping prod + publish on the same
        # interpreter prevents surprises in import smoke tests.
        run: uv python install 3.13

      - name: Verify tag matches pyproject version
        # Catches the foot-gun where someone tags v0.4.12 but pyproject
        # still says 0.4.11. We compare the tag (vX.Y.Z) to the version
        # uv reports for the project.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          pyproj_version=$(uv version --short 2>/dev/null || python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pyproject=$pyproj_version"
          if [ "$tag" != "$pyproj_version" ]; then
            echo "::error::Tag v$tag does not match pyproject version $pyproj_version"
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Smoke-test the wheel
        # Install the freshly-built wheel into a clean venv and import
        # the package. Catches packaging bugs (missing files, broken
        # imports) before PyPI sees them — there is no un-publish.
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/python -c "import tusk; print('import tusk OK')"

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Only publish on real tag pushes — manual dispatch from a non-tag
    # ref would build but should not publish.
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/tuskdata/
    permissions:
      id-token: write  # required for PyPI OIDC trusted publishing
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No token: OIDC handles auth. Verbose surface lets us debug
          # auth issues straight from the action logs if they recur.
          verbose: true
          print-hash: true

  image:
    name: Publish container image
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # `compat` polars runtime: runs on any x86-64 (no AVX2 needed).
          build-args: |
            TUSK_POLARS=compat
            WITH_CLUSTER=0
          cache-from: type=gha
          cache-to: type=gha,mode=max
