<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ dashboard.name }} - Tusk Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack.min.css">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="/static/tusk-app.css">
    <link rel="stylesheet" href="/static/plugins/bi/bi.css">
</head>
<body style="height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg)">
    <!-- Minimal header -->
    <header style="background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between">
        <div class="flex items-center gap-2">
            <span class="text-xl">&#129443;</span>
            <span class="font-bold">{{ dashboard.name }}</span>
        </div>
        <span class="text-xs" style="color:var(--fg-3)">Powered by Tusk Analytics</span>
    </header>

    <!-- Dashboard Content -->
    <div class="flex-1 overflow-y-auto" style="padding:24px">
        {% if dashboard.description %}
        <p class="text-sm" style="color:var(--fg-3);margin-bottom:16px">{{ dashboard.description }}</p>
        {% endif %}

        <div class="grid-stack" id="public-grid">
            {% for w in widgets %}
            <div class="grid-stack-item" gs-x="{{ w.col_start - 1 }}" gs-y="{{ w.row_start - 1 }}" gs-w="{{ w.col_span }}" gs-h="{{ w.row_span }}" gs-no-move="true" gs-no-resize="true">
                <div class="grid-stack-item-content card bi-widget" style="padding:12px">
                    <div class="flex items-center justify-between" style="margin-bottom:8px">
                        <h3 class="text-sm font-medium">{{ w.title }}</h3>
                    </div>
                    <div hx-get="/api/bi/widgets/{{ w.id }}/render"
                         hx-trigger="load"
                         hx-swap="innerHTML">
                        <div class="flex items-center justify-center" style="height:100%;color:var(--fg-4)">
                            <div class="animate-spin rounded-full h-4 w-4 border-b-2" style="border-color:var(--fg-3)"></div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gridstack@10/dist/gridstack-all.js"></script>
    <script src="/static/plugins/bi/bi.js"></script>
    <!-- widgets.js defines biRenderChart/Sparkline/Map/Markdown, called by the HTMX-loaded partials -->
    <script src="/static/plugins/bi/widgets.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            GridStack.init({ column: 12, cellHeight: 60, staticGrid: true, disableOneColumnMode: true }, '#public-grid');
        });
        document.addEventListener('htmx:afterSwap', () => lucide.createIcons());
    </script>
</body>
</html>
