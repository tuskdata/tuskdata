# TuskData — Docker Compose for local smoke tests.
#
# Default profile: just the Studio. No Postgres sidecar — TuskData stores
# its own state in SQLite under /var/lib/tusk and treats Postgres as an
# external user-managed data source. Configure connections from the UI
# pointing at whatever PG you already run.
#
# Profiles:
#   --profile cluster   adds tusk scheduler + worker
#   --profile pg        adds a local Postgres sidecar (only for testing)
#   --profile dbtools   adds Adminer at :8080 to poke an external PG
#   --profile all       everything
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#
#   docker compose --profile cluster up --build
#   docker compose --profile pg --profile dbtools up

x-tusk-env: &tusk-env
  TUSK_DEBUG: "${TUSK_DEBUG:-0}"
  TUSK_LOG_LEVEL: "${TUSK_LOG_LEVEL:-info}"
  TUSK_LOG_FORMAT: "${TUSK_LOG_FORMAT:-console}"
  TUSK_QUERY_TIMEOUT: "${TUSK_QUERY_TIMEOUT:-300}"
  TUSK_CLUSTER_SECRET: "${TUSK_CLUSTER_SECRET:-}"
  TUSK_CLUSTER_TLS: "${TUSK_CLUSTER_TLS:-0}"
  TUSK_PORT: "${TUSK_PORT:-8000}"
  TZ: "${TZ:-UTC}"

x-build-args: &build-args
  TUSK_BI_REF: "${TUSK_BI_REF:-v0.2.1}"
  TUSK_CI_REF: "${TUSK_CI_REF:-v0.2.0}"
  TUSK_SEC_REF: "${TUSK_SEC_REF:-v0.2.0}"
  TUSK_CLUSTER_REF: "${TUSK_CLUSTER_REF:-v0.2.1}"
  TUSK_PLUGINS_ORG: "${TUSK_PLUGINS_ORG:-tuskdata}"

services:
  tusk:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        <<: *build-args
    image: tuskdata:local
    environment:
      <<: *tusk-env
    ports:
      # Map host:container. Host port comes from .env (default 7000 to
      # dodge typical Coolify dashboard collisions on 8000).
      - "${TUSK_HOST_PORT:-7000}:8000"
    volumes:
      - tusk-home:/var/lib/tusk
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # ---- tusk-cluster: scheduler + worker --------------------------------
  scheduler:
    profiles: ["cluster", "all"]
    image: tuskdata:local
    depends_on:
      tusk:
        condition: service_started
    environment:
      <<: *tusk-env
    command: ["sh", "-c", "exec tusk scheduler --host 0.0.0.0 --port 8814"]
    expose:
      - "8814"
    volumes:
      - tusk-home:/var/lib/tusk
    restart: unless-stopped

  worker:
    profiles: ["cluster", "all"]
    image: tuskdata:local
    depends_on:
      scheduler:
        condition: service_started
    environment:
      <<: *tusk-env
    command: ["sh", "-c", "exec tusk worker --scheduler scheduler:8814 --host 0.0.0.0 --port 8815"]
    expose:
      - "8815"
    volumes:
      - tusk-home:/var/lib/tusk
    deploy:
      replicas: 1
    restart: unless-stopped

  # ---- Optional local Postgres (only with --profile pg) ----------------
  # If you already have Postgres elsewhere (typical), skip this and add
  # the connection from the Studio UI. This service is for isolated
  # smoke tests only.
  postgres:
    profiles: ["pg", "all"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-tusk}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tusk}"
      POSTGRES_DB: "${POSTGRES_DB:-tusk}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tusk} -d ${POSTGRES_DB:-tusk}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- Adminer for poking an external (or local) Postgres --------------
  adminer:
    profiles: ["dbtools", "all"]
    image: adminer:latest
    ports:
      - "${ADMINER_HOST_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: "${ADMINER_DEFAULT_SERVER:-postgres}"
    restart: unless-stopped

volumes:
  postgres-data:
  tusk-home:
